services:
  diq-postgres:
    image: postgres:16-alpine
    container_name: diq-postgres
    hostname: diq-postgres
    environment:
      POSTGRES_DB: diamondagentiq
      POSTGRES_USER: diq
      POSTGRES_PASSWORD: ${DIQ_PG_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - diq_pg_data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./data/rules.sql:/docker-entrypoint-initdb.d/03-rules.sql:ro
      - ./data/migrations/005_summer_league_house_rules.sql:/docker-entrypoint-initdb.d/04-house-rules.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diq -d diamondagentiq"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - zetaris_default

volumes:
  diq_pg_data:

networks:
  zetaris_default:
    external: true
